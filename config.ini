[smtp]
# The hostname or IP address of your eDiscovery SMTP ingestion server
host = localhost
# The port your SMTP server is listening on (standard test port is often 1025)
port = 1025

[generation]
# How many total emails you want to blast into your archive per run
batch_size = 10
# The range of random attachments to include per email
min_attachments = 0
max_attachments = 1 

[dates]
# Set to true to randomize the Date header within the range below.
# Set to false to stamp every message with the current time.
randomize_date = false
# How many years back from now to start the random date range (end is always now).
range_years_back = 10
